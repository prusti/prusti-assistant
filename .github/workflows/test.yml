name: Test and publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["master", "pre-release", "release/0.12"]

jobs:
  # Test the extension on multiple OSs.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install NPM dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Package the extension
        run: npm run package

      # The git_contracts test depends on prusti/prusti, and the pcg submodule
      # of that repo has an SSH URL. Remove this once that URL uses HTTPS.
      - name: Fetch GitHub submodules over HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Run tests (headless)
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        id: runTests
        env:
          GITHUB_TOKEN: ${{ secrets.VIPER_ADMIN_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        with:
          run: npm test --full-trace

      - name: Collect coverage
        if: ${{ steps.runTests.outcome == 'success' }}
        run: npx nyc report --reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: ${{ steps.runTests.outcome == 'success' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: ./coverage/lcov.info

  # Publish the extension when we are on a release branch and the version
  # specified in package.json has not yet been published.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/pre-release' || github.ref == 'refs/heads/release/0.12')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install NPM dependencies
        run: npm install

      - name: Obtain version information
        run: |
          CURRENT_VERSION="$(
            cat package.json | jq '.version' --raw-output
          )"
          ALREADY_PUBLISHED="$(
            npx vsce show viper-admin.prusti-assistant --json \
              | jq --arg v "$CURRENT_VERSION" 'any(.versions[]; .version == $v)' --raw-output
          )"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "ALREADY_PUBLISHED=$ALREADY_PUBLISHED" >> $GITHUB_ENV

      - name: Package the extension
        run: npm run package -- ${{ github.ref == 'refs/heads/pre-release' && '--pre-release' || '' }}

      - name: Publish the extension to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1.7.0
        if: env.ALREADY_PUBLISHED != 'true'
        with:
          pat: ${{ secrets.VSCE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: prusti-assistant-${{ env.CURRENT_VERSION }}.vsix
          packagePath: ''
          preRelease: ${{ github.ref == 'refs/heads/pre-release' }}

      - name: Publish the extension to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1.7.0
        if: env.ALREADY_PUBLISHED != 'true'
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: prusti-assistant-${{ env.CURRENT_VERSION }}.vsix
          packagePath: ''
          preRelease: ${{ github.ref == 'refs/heads/pre-release' }}

      - name: Create a release for the published version
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: env.ALREADY_PUBLISHED != 'true' && github.ref != 'refs/heads/pre-release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release v${{ env.CURRENT_VERSION }}
          tag_name: v${{ env.CURRENT_VERSION }}
          files: prusti-assistant-${{ env.CURRENT_VERSION }}.vsix
